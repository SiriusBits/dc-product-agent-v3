sections:
- name: Applications
  page: 2
  text: 'MHHPA NC is a clear colorless, high purity liquid which can be used alone
    or in combination with hexahydrophthalic anhydride to produce a lower melting
    mixture or with other anhydrides to modify physical properties. Its low residual
    unsaturation level gives maximum resistance to yellowing in coatings and castings,
    making it desirable where premium optical and electrical performance are needed
    in epoxy casting and encapsulation applications. Also, gives excellent cure response
    at cure temperatures, resulting in high crosslinking and relatively high Tg.


    For more information on the use of anhydrides like MHHPA NC as epoxy curing agents,
    please consult the Technical Bulletin, "Formulating Anhydride-Cured Epoxy Systems",
    available from Dixie Chemical.'
- name: Formulation Example
  page: 3
  text: "MHHPA NC was formulated with a variety of epoxy resins. The samples were\
    \ formulated with 100 parts of epoxy resin, 84-117 parts MHHPA NC, and 1 part\
    \ 1-Methylimidazole. Viscosity was measured at 25\xB0C, and gel time was measured\
    \ at 100\xB0C. Samples were cured for 1 hour at 120\xB0C, followed by a post-cure\
    \ of 1 hour at 220\xB0C, and glass transition temperatures were measured using\
    \ a differential scanning calorimeter.\n\nThe following table summarizes these\
    \ results:"
- name: Handling & Storage
  page: 3
  text: 'MHHPA-NC will react with water to form methylhexahydrophthalic acid. This
    is normally undesirable, so MHHPA-NC should be stored in such a way that it is
    carefully protected from moisture contamination.


    For more details on the design of bulk storage for MHHPA-NC, consult the Dixie
    Chemical Company brochure "Epoxy Curing Agent Storage Requirements."'
- name: Special Handling Instructions
  page: 4
  text: "In some cases MHHPA NC may crystallize. If crystallization is observed, the\
    \ material can be heated to return the product to a liquid state.\n\nLoosen bung\
    \ caps on each drum and place the drums in a hotbox or oven at 80\xB0C for 24\
    \ hours. Upon removal from the hotbox, the product should be free of crystals.\
    \ The product should be used within 48 hours of melting to ensure no reoccurrence\
    \ of crystal formation.\n\nHeating MHHPA NC following this procedure does not\
    \ alter the chemical make-up or degrade any properties of the product."
- name: Health Hazards
  page: 4
  text: 'Read and understand the relevant Safety Data Sheets (SDS) for all products
    before use. These anhydrides are primary skin and eye irritants. Avoid contact
    with skin, eyes, and clothing. Use only with adequate ventilation. In case of
    contact, follow the procedures outlined in the SDS. Generally, these procedures
    include immediately flushing the affected skin or eyes with copious amounts of
    water for at least 15 minutes. In the case of eye contact, get medical attention.
    Wash contaminated clothing before reuse.


    Follow the recommendations in the SDS for personal protective equipment when handling
    these materials. At a minimum, these procedures typically include protective chemical
    goggles, impenetrable gloves, and measures to avoid breathing chemical vapors.'
- name: Availability
  page: 4
  text: MHHPA NC is available from Dixie Chemical in Pasadena, Texas. Contact your
    Dixie representative for details.
