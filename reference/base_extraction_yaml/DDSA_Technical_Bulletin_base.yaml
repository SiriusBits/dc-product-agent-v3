key_benefits:
- Long pot life at room temperature
- Excellent electrical properties
- Provides flexibility to castings
- Good chemical resistance
- Thermal stability
- Can be blended with other anhydrides to modify properties
- Reduces brittleness of cured polymers
- Useful for modifying other anhydrides to lower freezing points
applications_text: 'Dixie dodecenylsuccinic anhydride (DDSA) is a slightly viscous
  liquid anhydride. DDSA can be used as: An epoxy curing agent for electrical potting
  compounds, coatings, conductive adhesives, and syntactic foams; An intermediate
  in the preparation of corrosion inhibitors for oils and greases; As a leather tanning
  agent. When used as an epoxy-curing agent, it has a long pot life at room temperature
  and gives excellent electrical properties and flexibility to castings. DDSA can
  be used in blends with other anhydrides to modify physical properties of the mixture
  and to lend flexibility and reduce brittleness of cured polymers.'
applications:
- Epoxy curing agent for electrical potting compounds
- Coatings
- Conductive adhesives
- Syntactic foams
- Intermediate in preparation of corrosion inhibitors for oils and greases
- Leather tanning agent
- Modifier for other anhydrides to reduce freezing points
