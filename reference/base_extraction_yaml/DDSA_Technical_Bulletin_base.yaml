sections:
- name: Applications
  page: 3
  text: 'Dixie dodecenylsuccinic anhydride (DDSA) is a slightly viscous liquid anhydride.
    DDSA can be used as: An epoxy curing agent for electrical potting compounds, coatings,
    conductive adhesives, and syntactic foams; An intermediate in the preparation
    of corrosion inhibitors for oils and greases; As a leather tanning agent. When
    used as an epoxy-curing agent, it has a long pot life at room temperature and
    gives excellent electrical properties and flexibility to castings. DDSA can be
    used in blends with other anhydrides to modify physical properties of the mixture
    and to lend flexibility and reduce brittleness of cured polymers. For more information
    on the use of anhydrides like DDSA as epoxy curing agents, please consult the
    Technical Bulletin, FORMULATING ANHYDRIDE-CURED EPOXY SYSTEMS, available from
    Dixie Chemical.'
- name: Modifying Other Anhydrides
  page: 3
  text: As a liquid, DDSA is useful in modifying other anhydrides to lower their freezing
    points and make them easier to handle. The following plot shows how DDSA lowers
    the freezing point of five other anhydrides.
- name: Cure Catalysts
  page: 4
  text: The effect of benzyldimethylamine (BDMA) catalyst on mix stability was studied
    using the following formulations. Epoxy homopolymerization discussed above is
    a significant side reaction for uncatalyzed systems, so anhydride demand is less.
- name: Anhydride Level
  page: 5
  text: "Most applications use between 80-150 phr DDSA with bisphenol A (BPA) liquid\
    \ epoxy resins. Most high performance applications where high levels of heat or\
    \ chemical resistance, or high strength is required utilize about 140 phr. Example:\
    \ Formulations with 100 parts BPA liquid epoxy resin, DDSA, and 1.5 part BDMA\
    \ were prepared. The level of DDSA was varied from 84-140 phr. Samples were cured\
    \ for 30 minutes at 100\xB0C, the temperature was increased to 160\xB0C in ten\
    \ minutes, and then post-cured for 30 minutes. The following plot summarizes the\
    \ glass transition temperatures (Tg) for these formulations. The same experiments\
    \ were conducted with a 20:80 blend of DDSA and hexahydrophthalic anhydride."
- name: Cure Cycle
  page: 6
  text: "A formulation with 100 parts BPA liquid epoxy resin, 134 parts DDSA, and\
    \ 1 part BDMA was prepared. Samples were cured for 4 hours at 90\xB0C, and post-cured\
    \ for 4, 24, and 200 hours at 150\xB0C. The following plots show the effect of\
    \ post-cure on heat distortion temperature (HDT), and weight increases after 24\
    \ hours in boiling water and 3 hours in boiling acetone. Tensile testing was performed\
    \ at -25\xB0C, and at room temperature. The following plots summarize results\
    \ for tensile strength, tensile modulus, and elongation at break."
- name: Electrical Properties
  page: 9
  text: "A formulation with 100 parts BPA liquid epoxy resin, 138 parts DDSA, and\
    \ 1.46 part BDMA was prepared. Samples were cured for 4 hours at 80\xB0C, and\
    \ post-cured for 24 hours at 100\xB0C. The following table summarizes electrical,\
    \ mechanical, and heat stability data for this formulation."
- name: Handling & Storage
  page: 10
  text: DDSA will react with water to form dodecenylsuccinic acid. This is normally
    undesirable, so DDSA should be stored in such a way that it is carefully protected
    from moisture contamination. For more details on the design of bulk storage for
    DDSA, consult the Dixie Chemical brochure 'Epoxy Curing Agent Storage Requirements.'
- name: Health Hazards
  page: 10
  text: Read and understand the relevant Safety Data Sheets (SDS) for all products
    before use. These anhydrides are primary skin and eye irritants. Avoid contact
    with skin, eyes, and clothing. Use only with adequate ventilation. In case of
    contact, follow the procedures outlined in the SDS. Generally, these procedures
    include immediately flushing the affected skin or eyes with copious amounts of
    water for at least 15 minutes. In the case of eye contact, get medical attention.
    Wash contaminated clothing before reuse. Follow the recommendations in the SDS
    for personal protective equipment when handling these materials. At a minimum,
    these procedures typically include protective chemical goggles, impenetrable gloves,
    and measures to avoid breathing chemical vapors.
- name: Availability
  page: 11
  text: Dodecenylsuccinic anhydride is available from Dixie Chemical, Pasadena, Texas.
    Contact your Dixie representative for details.
