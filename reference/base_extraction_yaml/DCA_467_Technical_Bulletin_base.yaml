key_benefits:
- Crosslinked Properties Obtained at Room Temperature
- Improved Water, Alcohol and Print Resistance
- Increased Chemical, Stain and Abrasion Resistance
applications_text: 'DCA 467 is a polyaziridine crosslinker. Addition of one to three
  percent DCA 467 to acrylic emulsions or waterborne urethane polymers produces a
  marked improvement in water, chemical, abrasion, and humidity resistance. It is
  ideal for use with fast air-dry NeoCryl acrylic emulsions, NeoRez waterborne urethane
  and NeoPac urethane acrylic copolymer products. In addition, DCA 467 can be used
  with solvent based systems provided reactive carboxyl functionality is present.


  The equivalent weight of DCA 467 is 157 g/mole. For many applications, 0.6 equivalents
  of DCA 467 are sufficient to achieve the optimum improvement in film properties.
  However, some systems may require the full stoichiometric equivalent of crosslinker.'
applications:
- Crosslinker for acrylic emulsions
- Crosslinker for waterborne urethane polymers
- Crosslinker for urethane acrylic copolymers
- Crosslinker for solvent-based systems with carboxyl functionality
- Water resistance enhancement
- Chemical resistance enhancement
- Abrasion resistance enhancement
- Humidity resistance enhancement
