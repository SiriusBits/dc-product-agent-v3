sections:
- name: Applications
  page: 1
  text: Chloroglycerine can be used as a starting material for the preparation of
    pharmaceutical intermediates. It is also used as a fungicide and has found efficacy
    as a chemosterilant for rodent control. CG is commonly used to prepare glycidol
    ethers, esters and amines.
- name: Handling & Storage
  page: 1
  text: Chloroglycerine should be stored in a well-ventilated area. Drums should be
    kept tightly sealed.
- name: Health Hazards
  page: 1
  text: 'Read and understand the relevant Safety Data Sheets (SDS) for all products
    before use. Both mono- and dichloroglycerines are harmful when taken internally
    and when absorbed through the skin. Extreme care should be taken to avoid any
    exposure to this chemical. In case of contact, follow the procedures outlined
    in the SDS. Generally, these procedures include immediately flushing the affected
    skin or eyes with copious amounts of water for at least 15 minutes. In case of
    contact to eyes, skin or by inhalation, get medical attention. Wash contaminated
    clothing before reuse.


    Follow the recommendations in the SDS for personal protective equipment when handling
    chloroglycerine. Impenetrable gloves, chemically impervious apron over lab coat
    and full coverage clothing are recommended. Wear chemical goggles and a face shield
    in combination. If ventilation is insufficient, wear respiratory protection.'
- name: Availability
  page: 2
  text: Chloroglycerine is available from Dixie Chemical in Pasadena, Texas. Contact
    your Dixie representative for details.
