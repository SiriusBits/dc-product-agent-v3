applications_text: Chloroglycerine can be used as a starting material for the preparation
  of pharmaceutical intermediates. It is also used as a fungicide and has found efficacy
  as a chemosterilant for rodent control. CG is commonly used to prepare glycidol
  ethers, esters and amines.
