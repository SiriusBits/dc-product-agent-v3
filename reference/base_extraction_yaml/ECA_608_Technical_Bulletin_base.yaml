sections:
- name: Applications
  page: 1
  text: "ECA 608 is a low viscosity, non-crystallizing liquid anhydride epoxy curing\
    \ agent blend. For convenience, it is pre-catalyzed with latent proprietary accelerators\
    \ that impart high reactivity at process temperatures, while maintaining excellent\
    \ pot life. It is designed to cure efficiently in processes such as pultrusion\
    \ where residence time at curing temperature is limited. ECA 608 has the following\
    \ characteristics:\n\n\u2022 Easy Handling: Low viscosity liquid gives low viscosity\
    \ mixes with various epoxy resins\n\n\u2022 Convenience: Eliminates the need to\
    \ add small amounts of catalyst\n\n\u2022 Consistency: Prevents potential batch-to-batch\
    \ differences caused by errors in measuring and properly dispersing small amounts\
    \ of catalyst\n\n\u2022 Low reactivity at room temperature: Provides long working\
    \ times and pot lives for mixes with epoxy resins. Formulations of ECA 608 and\
    \ liquid epoxies have a long pot life/working time in excess of 24 hours.\n\n\u2022\
    \ High reactivity at cure temperature: Gives excellent cure response at cure temperatures,\
    \ resulting in high crosslinking and relatively high Tg.\n\nFor more information\
    \ on the use of anhydrides like ECA 608 as epoxy curing agents, please consult\
    \ the Technical Bulletin, FORMULATING ANHYDRIDE-CURED EPOXY SYSTEMS, available\
    \ from Dixie Chemical Company."
- name: Formulation Example
  page: 2
  text: "ECA 608 was formulated with a variety of epoxy resins. Viscosity was measured\
    \ at 25\xB0C, and gel time was measured at 100\xB0C. Samples were cured for 1\
    \ hour at 120\xB0C, followed by a post-cure of 1 hour at 220\xB0C, and glass transition\
    \ temperatures were measured using a differential scanning calorimeter. The following\
    \ table summarizes these results:"
- name: Comparative Study
  page: 3
  text: 'Different pre-catalyzed anhydrides were formulated with a standard BPA liquid
    epoxy resin. The following table summarizes these results:'
- name: Handling & Storage
  page: 3
  text: 'ECA 608 will react with water to form diacids. This is normally undesirable,
    so ECA 608 should be stored in such a way that it is carefully protected from
    moisture contamination.


    For more details on the design of bulk storage for ECA 608, consult the Dixie
    Chemical Company brochure "Epoxy Curing Agent Storage Requirements."'
- name: Health Hazards
  page: 3
  text: 'Read and understand the relevant Safety Data Sheets (SDS) for all products
    before use. These anhydrides are primary skin and eye irritants. Avoid contact
    with skin, eyes, and clothing. Use only with adequate ventilation. In case of
    contact, follow the procedures outlined in the SDS.


    Generally, these procedures include immediately flushing the affected skin or
    eyes with copious amounts of water for at least 15 minutes. In the case of eye
    contact, get medical attention. Wash contaminated clothing before reuse.


    Follow the recommendations in the SDS for personal protective equipment when handling
    these materials. At a minimum, these procedures typically include protective chemical
    goggles, impenetrable gloves, and measures to avoid breathing chemical vapors.'
- name: Availability
  page: 4
  text: ECA 608 is available from Dixie Chemical Company, Inc.'s plant in Pasadena,
    Texas. Contact your Dixie representative for details.
