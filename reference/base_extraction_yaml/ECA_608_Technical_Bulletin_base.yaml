key_benefits:
- Low viscosity, non-crystallizing liquid anhydride epoxy curing agent blend
- Pre-catalyzed with latent proprietary accelerators
- High reactivity at process temperatures
- Excellent pot life
- Easy handling
- Convenience
- Consistency
- Low reactivity at room temperature
