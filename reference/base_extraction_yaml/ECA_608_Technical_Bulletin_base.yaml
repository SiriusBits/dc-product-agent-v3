applications_text: ECA 608 is a low viscosity, non-crystallizing liquid anhydride
  epoxy curing agent blend. For convenience, it is pre-catalyzed with latent proprietary
  accelerators that impart high reactivity at process temperatures, while maintaining
  excellent pot life. It is designed to cure efficiently in processes such as pultrusion
  where residence time at curing temperature is limited.
applications:
- Pultrusion processes
- Epoxy curing
- Processes with limited residence time at curing temperature
