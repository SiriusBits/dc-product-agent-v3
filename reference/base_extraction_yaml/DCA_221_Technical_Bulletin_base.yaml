sections:
- name: Applications
  page: 1
  text: DCA 221 is used as a curing agent in performance epoxy resins systems.
- name: Formulating Advantages with DCA 221
  page: 1
  text: 'Balance of properties: Imparts high impact resistance to epoxy systems. Has
    low temperature thermal shock resistance. Provides excellent adhesion, steel-to-steel
    and aluminum-to-aluminum. Product quality: Permanent, built-in flexibility. Light
    color. Low viscosity. Provides low viscosity and moderate pot life when properly
    combined with liquid Bisphenol A-based resins. Versatility of application: Adhesives,
    tooling, electrical potting and encapsulation, and troweling compounds. Working
    time in coatings can be further extended by the addition of a ketone solvent (10-15%
    on resin weight).'
- name: Electrical Properties
  page: 4
  text: "DCA 221 is highly recommended for a wide range of potting, impregnation,\
    \ and coating applications for moderate temperature electrical service. It offers\
    \ the following advantages: Low viscosity, Very low vapor pressure, High boiling\
    \ point, Permanent flexibility, Excellent thermal shock resistance, Excellent\
    \ electrical properties to 60\xB0C (140\xB0F). Proper formulation can provide\
    \ faster cure and improved electrical characteristics at elevated temperatures.\
    \ DCA 221 has excellent wetting properties with fillers, metal, and glass. As\
    \ a hardener and reactive diluent, it offers exciting possibilities in the development\
    \ of tailor-made electrical formulations."
- name: Availability
  page: 4
  text: DCA 221 is available from Dixie Chemical in Pasadena, TX. Contact your Dixie
    representative for details.
