product_info:
  product_name: Dixie Chemical Amine 221
  product_short_name: DCA 221
  product_family: Polyglycoldiamine
  cas_number: 4246-51-9
  chemical_name: Polyglycoldiamine
  synonyms:
  - DCA 221
  - Dixie Chemical Amine 221
  - Polyglycoldiamine
registrations: []
key_benefits:
- Imparts high impact resistance to epoxy systems
- Has low temperature thermal shock resistance
- Provides excellent adhesion, steel-to-steel and aluminum-to-aluminum
- Permanent, built-in flexibility
- Light color
- Low viscosity
- Provides low viscosity and moderate pot life when properly combined with liquid
  Bisphenol A-based resins
- Very low vapor pressure
- High boiling point
- Excellent thermal shock resistance
- "Excellent electrical properties to 60\xB0C (140\xB0F)"
- Excellent wetting properties with fillers, metal, and glass
applications_text: DCA 221 is used as a curing agent in performance epoxy resins systems.
  Applications include adhesives, tooling, electrical potting and encapsulation, and
  troweling compounds. Working time in coatings can be further extended by the addition
  of a ketone solvent (10-15% on resin weight). DCA 221 is highly recommended for
  a wide range of potting, impregnation, and coating applications for moderate temperature
  electrical service.
applications:
- Curing agent in performance epoxy resin systems
- Adhesives
- Tooling compounds
- Electrical potting and encapsulation
- Troweling compounds
- Coatings with extended working time
- Potting applications for electrical service
- Impregnation applications for electrical service
- Coating applications for electrical service
- High impact resistance castings
- Highly flexible compounds
- Flooring applications
