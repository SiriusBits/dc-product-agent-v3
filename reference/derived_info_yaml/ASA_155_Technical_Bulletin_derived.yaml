derived_info:
  summary: ASA 155 is an alkenylsuccinic anhydride (ASA) based on C16-C18 alpha-olefin,
    consisting of a blend of hexadecenylsuccinic anhydride (HDSA) and octadecenylsuccinic
    anhydride (ODSA). It is primarily used as an alkaline paper sizing agent and can
    be employed in both cationic starch and polymer emulsion systems. The product
    is available in four variants with different surfactant combinations. ASA 155
    has a shelf life of 24 months when properly stored away from moisture to prevent
    hydrolysis. It is REACh registered with CASRN 68784-12-3 and registry number 01-2119533117-46.
    The technical bulletin provides detailed physical properties, handling instructions,
    and safety information for this versatile chemical that finds applications in
    paper sizing, metal working fluids, fuel additives, surfactant intermediates,
    plasticizers, epoxies, and leather goods.
  personas:
    sales_summary: ASA 155 is a premium alkenylsuccinic anhydride blend designed for
      alkaline paper sizing applications with excellent handling characteristics.
      Available in four variants with different surfactant combinations (standard,
      with DOSS, with phosphate ester, or with both), it offers customization options
      to meet specific customer requirements. Beyond paper sizing, ASA 155 delivers
      value in multiple industries including metal working fluids as a corrosion inhibitor,
      fuel and lubricant additives for pour point depression and dispersion, and as
      an intermediate for surfactants, plasticizers, epoxies, and leather goods. With
      a 24-month shelf life and REACh registration, this product combines regulatory
      compliance with versatile performance.
    technical_summary: ASA 155 is a blend of hexadecenylsuccinic anhydride (HDSA,
      38-43%) and octadecenylsuccinic anhydride (ODSA, 57-62%) with CAS number 68784-12-3
      and REACh registry number 01-2119533117-46. The product has a neutralization
      number of 325-360 mg KOH/g, specific gravity of 0.93-0.98 at 25°C, and viscosity
      up to 300 cPs at 25°C. Both viscosity and specific gravity decrease with temperature
      according to provided graphs. The product must be stored away from moisture
      to prevent hydrolysis, with a 24-month shelf life when properly stored. Storage
      tanks may be constructed of mild steel, though 304/316 stainless steel is preferred
      when moisture protection is difficult. ASA 155 is available in four variants
      with different surfactant combinations to meet specific application requirements.
  key_applications:
  - Alkaline paper sizing agent
  - Cationic starch systems
