[project]
name = "dc-agent-backend"
version = "0.1.0"
description = "Backend API for Dixie Chemical Product Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "chromadb>=0.4.22",
    "neo4j>=6.1.0",
    "graphiti-core>=0.28.1",
    "openai>=2.21.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "datamodel-code-generator>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # graphiti-core uses Pydantic v1-style class Config — suppress until upstream fixes
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[dependency-groups]
dev = [
    "requests>=2.32.5",
]
