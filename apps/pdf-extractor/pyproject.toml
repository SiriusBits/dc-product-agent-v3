[project]
name = "pdf-data-extractor"
version = "0.1.0"
description = "Utility for extracting metadata and text from PDF technical bulletins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyPDF2>=3.0.0",
    "jsonschema>=4.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
