[project]
name = "dc-pdf-extractor"
version = "3.0.0"
description = "PDF extraction utility for Dixie Chemical technical bulletins - migrated from external repository"
authors = [{ name = "Dixie Chemical", email = "dev@dixiechemical.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf", "PyYAML>=6.0.2", "jsonschema>=4.25.1"]

[project.scripts]
dc-pdf-extractor = "dc_extractor.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
dev-dependencies = ["pytest>=8.4.2", "ruff>=0.12.12", "black>=25.1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["reference/", "docs/", "node_modules/", ".venv/"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = "(reference|docs|node_modules|.venv)"
