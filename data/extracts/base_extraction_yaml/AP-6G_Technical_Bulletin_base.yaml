sections:
- name: Applications
  page: 1
  text: AP-6G is a quaternary ammonium salt that is well known as phase-transfer catalyst
    and many other industrial applications.
- name: Handling & Storage
  page: 1
  text: AP-6G is hygroscopic and stable under normal recommended conditions. It should
    be stored away from moisture, high temperatures, ignition sources, or oxidizing
    materials.
- name: Health Hazards
  page: 1
  text: 'Avoid contact with skin, eyes, and clothing. Use only with adequate ventilation.
    In case of contact, immediately flush the affected skin or eyes with copious amounts
    of water for at least 15 minutes. In the case of eye contact, get medical attention.
    Wash contaminated clothing before reuse.


    The minimum personal protective equipment when handling these materials typically
    includes protective chemical goggles, impenetrable gloves, and measures to avoid
    breathing chemical vapors. Please consult the SDS of AP-6G for more details to
    handle the chemical safely.

    '
- name: Availability
  page: 2
  text: AP-6G is available from Dixie Chemical in Pasadena, Texas. Contact your Dixie
    Chemical Company representative for details.
