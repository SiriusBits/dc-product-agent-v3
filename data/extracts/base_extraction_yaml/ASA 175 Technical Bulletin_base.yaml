sections:
  - name: "Applications"
    page: 2
    page_start: 2
    page_end: 2
    text: |
      ASA 175 is an alkenylsuccinic anhydride (ASA) based on C16-C18 alpha-olefin. The material is a blend of hexadecenylsuccinic anhydride (HDSA) and octadecenylsuccinic anhydride (ODSA). ASAs such as ASA 175 are commonly used as alkaline paper sizing agents. These products are easy to handle and can be employed in both cationic starch and polymer emulsion systems. ASAs are also used in a variety of other products. In metal working fluids, ASAs are utilized as corrosion inhibitors. ASAs are often used in fuel and lubricant additives including pour point depressants, corrosion inhibitors and dispersants. ASAs find use as intermediates for surfactants and can also be converted to acid amides and esters. Other suggested applications are in plasticizers, epoxies, and moisture control for leather goods.
      
      Dixie’s ASA 175 is available with or without surfactant. Two types of surfactant are available, dioctylsulfo-succinate (DOSS) or phosphate ester.
  - name: "Registration"
    page: 3
    page_start: 3
    page_end: 3
    text: |
      ASA 175 is REACh registered as a component under the name 2,5-Furandione,dihydro-,mono-C15-20-alkenyl derivs. The CASRN is 68784-12-3 and the REACh registry number is 01-2119533117-46. In the US, CASRN 32072-96-1 is typically used for HDSA and CASRN 28777-98-2 is typically used for ODSA.
  - name: "Handling & Storage"
    page: 3
    page_start: 3
    page_end: 3
    text: |
      ASA 175 must be stored out of contact with moisture to avoid hydrolysis of the anhydride to the acid. When properly stored, ASA 175 has a shelf life of 24 months.
      
      ASA storage tanks may be constructed of mild steel, 304 or 316 stainless steel. If protection from atmospheric moisture is difficult then 304 or 316 are preferred due to the formation of corrosive acids by the interaction of ASA with water. For more information on the design of bulk storage for ASA products, consult the Dixie Chemical brochure “Alkenylsuccinic Anhydride Storage Requirements.”
  - name: "Health Hazards"
    page: 3
    page_start: 3
    page_end: 3
    text: |
      Read and understand the relevant Safety Data Sheets (SDS) for all products before use. ASA 175 is a mild skin sensitizer. Avoid contact with skin, eyes and clothing. Use only with adequate ventilation. In case of contact, immediately flush skin or eyes with plenty of water for at least 15 minutes; for eyes, get medical attention. Wash contaminated clothing before reuse.
  - name: "Availability"
    page: 3
    page_start: 3
    page_end: 3
    text: |
      ASA 175 is available from Dixie Chemical in Pasadena, TX. Contact your Dixie representative for details.
