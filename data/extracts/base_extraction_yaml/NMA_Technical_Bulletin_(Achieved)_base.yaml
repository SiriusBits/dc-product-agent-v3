sections:
- name: Applications
  page: 1
  text: "NADIC\xAE methyl anhydride (NMA) is a highly reactive anhydride that is used\
    \ as a curing agent for epoxy resins in applications requiring high temperature\
    \ resistance, excellent electrical properties, and good chemical resistance. NMA\
    \ is used in a variety of applications including:\n\n\u2022 Aerospace and military\
    \ applications\n\u2022 Electrical laminates\n\u2022 Filament winding\n\u2022 Electrical\
    \ encapsulation\n\u2022 Tooling\n\u2022 Composites\n\u2022 Powder coatings"
- name: Anhydride Levels
  page: 3
  text: 'The level of anhydride used in a formulation is generally expressed in terms
    of parts per hundred resin (phr). The theoretical level of anhydride required
    to react with all of the epoxy groups in a resin is calculated as follows:


    Anhydride Level (phr) = Anhydride Equivalent Weight x 100 / Epoxy Equivalent Weight


    For NMA with an equivalent weight of 178.2 and a standard bisphenol A epoxy resin
    with an equivalent weight of 190, the theoretical level would be:


    178.2 x 100 / 190 = 93.8 phr


    The table below shows the performance of NMA at different phr levels.'
- name: Examples
  page: 4
  text: "Dow Chemical Company conducted an excellent and extensive formulation study\xB9\
    \ in which a variety of liquid epoxy resins were formulated with NADIC methyl\
    \ anhydride. The results of this study are shown in the table on the following\
    \ page.\n\nThe data shows that NMA produces cured systems with excellent physical\
    \ and electrical properties. The heat deflection temperatures are in the 145\xB0\
    C range for the standard bisphenol A resins. The electrical properties are excellent\
    \ with low dissipation factors and high volume and surface resistivities.\n\n\
    Momentive has published a formulation\xB2 for a resin system based on this bisphenol\
    \ A novolac and NADIC methyl anhydride. The formulation consists of 100 parts\
    \ of epoxy bisphenol A novolac resin, 80 parts of NMA, and 0.5 parts of benzyldimethylamine.\
    \ The system is cured for 2 hours at 100\xB0C followed by 4 hours at 175\xB0C.\
    \ The properties of this system are shown in the table below."
- name: Cure Catalysts
  page: 6
  text: Tertiary amines are effective catalysts for the reaction of anhydrides with
    epoxy resins. Benzyldimethylamine (BDMA) is commonly used at levels of 0.5 to
    1.0 phr. Other effective catalysts include 2-methylimidazole and 2-ethyl-4-methylimidazole.
- name: Cure Cycle
  page: 6
  text: "The cure cycle for NMA with epoxy resins typically involves a gel stage at\
    \ 80-100\xB0C followed by a post-cure at 150-175\xB0C. The gel stage allows the\
    \ resin to flow and wet out reinforcements before it gels. The post-cure develops\
    \ the final properties of the system.\n\nA typical cure cycle would be:\n\u2022\
    \ Gel stage: 2 hours at 100\xB0C\n\u2022 Post-cure: 4 hours at 175\xB0C\n\nThe\
    \ table below shows the effect of temperature on the properties of NMA-cured epoxy\
    \ systems. The data shows that NMA-cured systems retain a significant portion\
    \ of their room temperature properties at elevated temperatures."
- name: Safety Information
  page: 8
  text: "NADIC\xAE methyl anhydride (NMA) is corrosive to the skin and eyes. It may\
    \ cause sensitization by skin contact. Avoid contact with skin and eyes. Wear\
    \ suitable protective clothing, gloves, and eye/face protection. In case of contact\
    \ with eyes, rinse immediately with plenty of water and seek medical advice. After\
