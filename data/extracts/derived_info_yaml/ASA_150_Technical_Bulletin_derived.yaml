derived_info:
  summary: ASA 150 is an alkenylsuccinic anhydride based on C16-C18 alpha-olefin,
    consisting of a blend of hexadecenylsuccinic anhydride (HDSA) and octadecenylsuccinic
    anhydride (ODSA). This versatile chemical is primarily used as an alkaline paper
    sizing agent but finds applications across multiple industries including metal
    working fluids, fuel and lubricant additives, surfactant intermediates, and specialty
    chemical applications. ASA 150 is REACh registered and available with or without
    surfactant options (DOSS or phosphate ester), making it suitable for both cationic
    starch and polymer emulsion systems.
  personas:
    sales_summary: ASA 150 offers exceptional versatility across multiple high-value
      markets including paper manufacturing, metalworking, and specialty chemicals.
      Key selling advantages include REACh registration for EU compliance, dual surfactant
      options for customized performance, and proven effectiveness in both cationic
      starch and polymer emulsion systems. The product's broad application range from
      paper sizing to corrosion inhibition provides multiple revenue opportunities,
      while its excellent handling characteristics and 24-month shelf life ensure
      customer satisfaction and reduced waste.
    technical_summary: ASA 150 is a C16-C18 alkenylsuccinic anhydride blend (CAS 68784-12-3)
      containing 40-60% each of HDSA and ODSA components. Key specifications include
      Gardner color ≤10, residual olefin ≤3%, free acid ≤2%, neutralization number
      325-360 mg KOH/g, pour point -36°C, and freeze point -21°C. The product requires
      moisture-free storage to prevent hydrolysis and is compatible with mild steel
      or stainless steel (304/316) storage systems. Temperature-dependent properties
      show viscosity decreasing from 8.1 to 7.86 cPs over 0-60°C range.
  key_applications:
  - Alkaline paper sizing agents
  - Cationic starch systems
  - Polymer emulsion systems
  - Corrosion inhibitors in metal working fluids
  - Pour point depressants in fuel additives
  - Dispersants in lubricant additives
  - Surfactant intermediates
  - Acid amides and esters production
  - Plasticizer applications
  - Epoxy resin applications
  - Moisture control for leather goods
