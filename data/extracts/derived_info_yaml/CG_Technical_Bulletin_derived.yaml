derived_info:
  summary: This technical bulletin provides detailed information about Chloroglycerine (CG), also known as 3-CHLORO-1, 2-PROPANEDIOL
    (CASRN 96-24-2). The product is a clear to light yellow viscous liquid with a specific gravity of 1.310-1.325 at 25°C,
    minimum chloroglycerine content of 98.5%, and maximum water content of 1.0%. Chloroglycerine serves multiple applications,
    primarily as a starting material for pharmaceutical intermediates, as a fungicide, and as a chemosterilant for rodent
    control. It is also commonly used to prepare glycidol ethers, esters, and amines. The bulletin emphasizes important handling
    and safety considerations, noting that both mono- and dichloroglycerines are harmful when taken internally or absorbed
    through the skin. Storage recommendations include keeping the product in a well-ventilated area with drums tightly sealed.
    Extensive personal protective equipment is required when handling the material, including impenetrable gloves, chemically
    impervious apron over lab coat, full coverage clothing, chemical goggles with face shield, and respiratory protection
    when ventilation is insufficient. The bulletin provides emergency procedures for exposure, including flushing affected
    areas with water for at least 15 minutes and seeking medical attention. Chloroglycerine is available from Dixie Chemical
    in Pasadena, Texas.
  personas:
    sales_summary: Chloroglycerine (CG) is a high-purity specialty chemical (minimum 98.5% purity) with versatile applications
      across pharmaceutical, agricultural, and chemical synthesis markets. This clear to light yellow viscous liquid serves
      as a valuable starting material for pharmaceutical intermediates, offering your customers a reliable building block
      for their API development processes. In the agricultural sector, CG functions effectively as both a fungicide and a
      chemosterilant for rodent control programs, providing multiple value streams from a single product. For chemical manufacturers,
      CG serves as an essential precursor for synthesizing glycidol derivatives, including ethers, esters, and amines—compounds
      with applications spanning multiple industries. Dixie Chemical maintains strict quality control on this product, ensuring
      consistent physical properties including specific gravity (1.310-1.325) and color (50 Max Pt-Co). While the product
      requires careful handling due to its toxicological profile, we provide comprehensive safety documentation and handling
      guidelines to support your customers in implementing appropriate protocols. Chloroglycerine is readily available from
      our Pasadena, Texas facility with technical support from our experienced team to assist your customers in optimizing
      their applications.
    technical_summary: Chloroglycerine (3-CHLORO-1, 2-PROPANEDIOL, CAS 96-24-2) is a high-purity chlorinated alcohol (minimum
      98.5%) with maximum water content of 1.0%. The material appears as a clear to light yellow viscous liquid with a specific
      gravity range of 1.310-1.325 at 25°C and maximum Pt-Co color of 50. Primary applications include use as a pharmaceutical
      intermediate precursor, agricultural applications (fungicide and rodent chemosterilant), and as a synthetic building
      block for glycidol derivatives (ethers, esters, and amines). The compound presents significant toxicological concerns,
      being harmful via both oral ingestion and dermal absorption routes. Implementation of comprehensive safety protocols
      is essential, including storage in well-ventilated areas with tightly sealed containers. Required personal protective
      equipment includes impenetrable gloves, chemically impervious apron over lab coat, full coverage clothing, chemical
      goggles with face shield, and respiratory protection when ventilation is insufficient. Emergency response procedures
      for exposure include immediate flushing of affected areas with water for at least 15 minutes followed by medical attention.
      Quality control testing employs standard methods including D-104 (appearance), D-103 (color), D-102 (specific gravity),
      D-131C (chloroglycerine content), and D-101 (water content).
