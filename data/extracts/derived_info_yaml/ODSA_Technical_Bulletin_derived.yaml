derived_info:
  summary: This technical bulletin provides detailed information about Octadecenylsuccinic Anhydride (ODSA), a versatile alkenyl
    succinic anhydride (ASA) based on C18 alpha-olefin manufactured by Dixie Chemical. The document outlines ODSA's typical
    properties, applications, registration information, handling and storage requirements, health hazards, and availability.
    ODSA is characterized as an amber colored liquid with a mild odor, having a specific gravity of 0.945-0.965 g/cc at 25°C,
    a Gardner Color of 10 Max, and a minimum ODSA content of 90.0%. The bulletin includes temperature-dependent property graphs
    showing how viscosity decreases from approximately 180 cPs at 20°C to 15 cPs at 80°C, and how specific gravity decreases
    from 8.04 lbs/gal at 0°C to 7.75 lbs/gal at 60°C. ODSA has multiple applications, primarily as an alkaline paper sizing
    agent, but also in fuel and lubricant additives (pour point depressants, corrosion inhibitors, and dispersants), as intermediates
    for surfactants, and in plasticizers, epoxies, and moisture control for leather goods. The product is REACh registered
    in the EU under the name 2,5-Furandione,dihydro-,mono-C15-20-alkenyl derivs (CASRN 68784-12-3) with registry number 01-2119533117-46,
    while in the US it is typically identified by CASRN 28777-98-2. The bulletin emphasizes that ODSA must be stored away
    from moisture to avoid hydrolysis of the anhydride to the acid, with a shelf life of 24 months when properly stored. Safety
    information indicates that ODSA is a mild primary skin irritant requiring adequate ventilation during handling and immediate
    flushing with water for at least 15 minutes in case of skin or eye contact. The product is available from Dixie Chemical's
    facility in Pasadena, Texas.
  personas:
    sales_summary: ODSA is a premium alkenyl succinic anhydride (ASA) derived from C18 alpha-olefin that offers exceptional
      versatility across multiple industries. This amber-colored liquid with mild odor provides reliable performance as an
      alkaline paper sizing agent—a key application where its consistent quality (minimum 90% ODSA content) delivers dependable
      results. Beyond paper manufacturing, ODSA creates significant value in the fuel and lubricant additives market, functioning
      as an effective pour point depressant, corrosion inhibitor, and dispersant. The product's well-characterized temperature-dependent
      properties—with viscosity decreasing predictably from 180 cPs at 20°C to 15 cPs at 80°C—ensure consistent processing
      across various application temperatures. ODSA's chemical versatility makes it an excellent intermediate for surfactant
      production and allows conversion to valuable acid amides and esters. Additional applications in plasticizers, epoxies,
      and leather goods moisture control further demonstrate this product's exceptional utility. With REACh registration in
      the EU and standard CAS identification in the US, ODSA meets regulatory requirements in major markets. The product offers
      excellent stability with a 24-month shelf life when properly stored, and Dixie Chemical provides comprehensive storage
      guidance through our "Alkenylsuccinic Anhydride Storage Requirements" brochure. Available from our Pasadena, Texas facility,
      ODSA represents a high-value, multi-functional chemical that can address diverse customer needs across paper, fuel,
      lubricant, surfactant, and specialty chemical markets.
    technical_summary: Octadecenylsuccinic Anhydride (ODSA) is an alkenyl succinic anhydride based on C18 alpha-olefin with
      CAS number 28777-98-2 (US) and 68784-12-3 (EU REACh registration as 2,5-Furandione,dihydro-,mono-C15-20-alkenyl derivs,
      registry number 01-2119533117-46). The product appears as an amber colored liquid with mild odor and exhibits specific
      gravity of 0.945-0.965 g/cc at 25°C (D-102/ASTM D 4052). ODSA has a Gardner Color of 10 Max (D-150G), residual olefin
      content of 3.0% Max, minimum ODSA content of 90.0%, free acid content of 2.0% Max, and neutralization value of 305-335
      mg KOH/g. Low-temperature handling characteristics include a pour point of -15°C (ASTM D97) and freeze point of -21°C
      (ASTM D1015). The product demonstrates predictable temperature-dependent behavior with viscosity decreasing exponentially
      from approximately 180 cPs at 20°C to 15 cPs at 80°C, and specific gravity decreasing linearly from 8.04 lbs/gal at
      0°C to 7.75 lbs/gal at 60°C. ODSA is susceptible to hydrolysis when exposed to moisture, converting the anhydride to
      the corresponding acid, necessitating moisture-free storage conditions. When properly stored, shelf life extends to
      24 months. The material is classified as a mild primary skin irritant requiring standard chemical handling precautions
      including adequate ventilation and appropriate personal protective equipment. Primary applications include alkaline
      paper sizing, fuel and lubricant additives (pour point depressants, corrosion inhibitors, dispersants), surfactant intermediates
      (convertible to acid amides and esters), plasticizers, epoxy formulations, and moisture control agents for leather goods.
