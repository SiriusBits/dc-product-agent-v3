derived_info:
  summary: AP-6G is a quaternary ammonium salt consisting of Benzyl Triethylammonium
    Chloride (CAS# 56-37-1) in Ethylene Glycol with an assay of 58-62%. It is primarily
    used as a phase-transfer catalyst in various industrial applications. The product
    is hygroscopic and requires storage away from moisture, high temperatures, ignition
    sources, and oxidizing materials. The technical bulletin provides handling instructions
    and safety information, emphasizing the need for protective equipment including
    chemical goggles, impenetrable gloves, and proper ventilation. AP-6G is available
    from Dixie Chemical in Pasadena, Texas.
  personas:
    sales_summary: AP-6G is a premium quaternary ammonium salt formulation of Benzyl
      Triethylammonium Chloride in Ethylene Glycol, offered at a consistent 58-62%
      concentration. This product serves as an effective phase-transfer catalyst for
      a wide range of industrial applications, providing reliable performance with
      excellent stability under recommended storage conditions. AP-6G is part of Dixie
      Chemical's specialty catalyst portfolio, backed by our technical expertise and
      quality manufacturing standards. Available from our Pasadena, Texas facility
      with customized technical support to help customers optimize their processes.
    technical_summary: AP-6G contains 58-62% Benzyl Triethylammonium Chloride (CAS#
      56-37-1) in Ethylene Glycol, functioning as a phase-transfer catalyst. The product
      is hygroscopic and requires storage away from moisture, high temperatures, ignition
      sources, and oxidizing materials to maintain stability. When handling AP-6G,
      protective equipment including chemical goggles, impenetrable gloves, and proper
      ventilation is essential due to potential skin and eye irritation hazards. In
      case of contact, immediate flushing with water for at least 15 minutes is recommended,
      with medical attention required for eye exposure. For detailed safety protocols,
      consult the product SDS.
  key_applications:
  - Phase-transfer catalyst
  - Industrial chemical processes
  - Organic synthesis
  - Polymer chemistry
  - Specialty chemical manufacturing
