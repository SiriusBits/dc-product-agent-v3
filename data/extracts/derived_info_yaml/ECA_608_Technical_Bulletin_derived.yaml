derived_info:
  summary: 'ECA 608 is a low viscosity, non-crystallizing liquid anhydride epoxy curing
    agent blend that is pre-catalyzed with latent proprietary accelerators. This pre-catalyzation
    provides dual benefits: high reactivity at process temperatures while maintaining
    excellent pot life at room temperature. The product is specifically designed for
    processes like pultrusion where residence time at curing temperature is limited.
    With a molecular weight of 172-174, specific gravity of 1.155-1.159 g/cc, and
    viscosity range of 50-200 cP, ECA 608 offers easy handling and consistent performance.
    It provides long working times (over 24 hours) at room temperature but delivers
    excellent cure response at elevated temperatures, resulting in high crosslinking
    and relatively high glass transition temperatures. When formulated with various
    epoxy resins, it achieves glass transition temperatures ranging from 138°C to
    231°C depending on the resin type. Comparative studies show ECA 608 offers advantages
    over other anhydrides including lower viscosity than ECA 607 and ECA 100KA, and
    better balance of gel time and cured Tg properties. The product requires protection
    from moisture contamination during storage as it reacts with water to form diacids.
    Safety precautions are necessary as anhydrides are primary skin and eye irritants.'
  personas:
    sales_summary: ECA 608 is our premium pre-catalyzed epoxy curing agent that solves
      multiple processing challenges in a single product. This green liquid offers
      exceptionally low viscosity (50-200 cP) for easy handling and excellent mixing
      with various epoxy resins. The built-in latent proprietary accelerators eliminate
      the need for additional catalyst addition, ensuring batch-to-batch consistency
      and simplifying your manufacturing process. ECA 608 delivers an ideal balance
      of long working time (24+ hours at room temperature) with rapid cure response
      at elevated temperatures, making it perfect for pultrusion and other processes
      where residence time at curing temperature is limited. When formulated with
      different epoxy resins, it achieves impressive glass transition temperatures
      up to 231°C with cycloaliphatic epoxy systems. Comparative testing shows ECA
      608 outperforms other anhydrides with better viscosity, onset temperature, and
      gel time characteristics. This versatile product works effectively with standard
      BPA liquid epoxy, low viscosity BPA liquid, cycloaliphatic epoxy, epoxy phenol
      novolac, epoxy BPA novolac, and BPF liquid epoxy systems, providing you with
      formulation flexibility across multiple applications.
    technical_summary: ECA 608 is a pre-catalyzed anhydride epoxy curing agent with
      molecular weight 172-174, specific gravity 1.155-1.159 g/cc, and viscosity 50-200
      cP at 25°C. This green liquid contains latent proprietary accelerators that
      provide low reactivity at room temperature (>24 hour pot life) but high reactivity
      at cure temperatures. When formulated with standard BPA liquid epoxy at 89 phr,
      it yields 750 cP viscosity, 20 min gel time at 100°C, and 152°C Tg after standard
      cure cycle (1h/120°C + 1h/220°C). With cycloaliphatic epoxy at 122 phr, it achieves
      231°C Tg. Comparative testing shows ECA 608 has 91°C onset temperature versus
      107°C for ECA 607 and 120°C for ECA 100KA. ECA 608 reacts with water to form
      diacids, requiring moisture protection during storage. The product is classified
      as a primary skin and eye irritant, necessitating appropriate PPE including
      chemical goggles, impenetrable gloves, and adequate ventilation. Recommended
      cure schedule is 1 hour at 120°C followed by 1 hour post-cure at 220°C for optimal
      properties.
  key_applications:
  - Pultrusion processes
  - Epoxy curing systems requiring long pot life
  - High Tg epoxy formulations
  - Processes with limited residence time at curing temperature
  - Cycloaliphatic epoxy systems requiring high Tg
  - BPA liquid epoxy formulations
  - Epoxy novolac systems
  - BPF liquid epoxy applications
  - Pre-catalyzed anhydride curing systems
  - Non-crystallizing anhydride applications
