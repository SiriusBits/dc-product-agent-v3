derived_info:
  summary: This technical bulletin provides detailed information about ASA 100 (Hexadecenylsuccinic
    Anhydride), an alkenylsuccinic anhydride based on C16 alpha-olefin with CAS Registry
    Numbers 68784-12-3 (EU) and 32072-96-1 (US). The product appears as a clear amber
    liquid with a specific gravity of 0.945-0.965 g/cc at 25°C, viscosity of 90-175
    cP at 25°C, and minimum HDSA content of 95%. ASA 100 is primarily used as an alkaline
    paper sizing agent that can be employed in both cationic starch and polymer emulsion
    systems. Additional applications include use as corrosion inhibitors in metal
    working fluids, additives in fuels and lubricants (pour point depressants, corrosion
    inhibitors, dispersants), intermediates for surfactants, and components in plasticizers,
    epoxies, and moisture control products for leather goods. The bulletin includes
    temperature-dependent viscosity and specific gravity graphs, showing how these
    properties change from 0°C to 60°C. Dixie Chemical offers ASA 100 with or without
    surfactant (either dioctylsulfo-succinate or phosphate ester). The product requires
    storage away from moisture to prevent hydrolysis, with a shelf life of 24 months
    when properly stored. Storage tanks may be constructed of mild steel or preferably
    304/316 stainless steel when protection from atmospheric moisture is difficult.
    The bulletin also notes that ASA 100 is a mild primary skin irritant requiring
    appropriate handling precautions.
  personas:
    sales_summary: ASA 100 is a premium hexadecenylsuccinic anhydride (HDSA) product
      with minimum 95% purity that offers versatile performance across multiple industries.
      This clear amber liquid is primarily valued as an alkaline paper sizing agent,
      where it delivers excellent results in both cationic starch and polymer emulsion
      systems. What sets ASA 100 apart is its adaptability - it serves as an effective
      corrosion inhibitor in metal working fluids, a performance-enhancing additive
      in fuels and lubricants, and a valuable intermediate for surfactant production.
      With its ability to be converted to acid amides and esters, ASA 100 also finds
      applications in plasticizers, epoxies, and leather goods moisture control. Dixie
      Chemical offers ASA 100 with customization options - available with or without
      surfactant (either dioctylsulfo-succinate or phosphate ester) to meet specific
      formulation requirements. The product features excellent handling characteristics,
      predictable temperature-dependent viscosity (90-175 cP at 25°C), and impressive
      low-temperature performance with a pour point of -34°C. ASA 100 is fully REACh
      registered in the EU and has established CAS registry numbers in both EU and
      US markets, ensuring regulatory compliance for your formulations.
    technical_summary: 'ASA 100 (Hexadecenylsuccinic Anhydride) is an alkenylsuccinic
      anhydride derived from C16 alpha-olefin with CAS numbers 68784-12-3 (EU) and
      32072-96-1 (US). The product has a minimum HDSA content of 95%, maximum residual
      olefin of 1%, and maximum free acid content of 1.5%. Physical properties include:
      clear amber appearance, specific gravity of 0.945-0.965 g/cc at 25°C, Gardner
      color of 10 max, viscosity of 90-175 cP at 25°C, neutralization number of 330-355
      mg KOH/g, pour point of -34°C, and freeze point of -21°C. Viscosity decreases
      exponentially with temperature from approximately 680 cP at 0°C to 30 cP at
      60°C, while specific gravity decreases linearly from 8.13 lbs/gal at 0°C to
      7.89 lbs/gal at 60°C. ASA 100 requires moisture-free storage to prevent hydrolysis
      to the acid form, with mild steel tanks acceptable, though 304/316 stainless
      steel is preferred when atmospheric moisture protection is challenging. The
      product has a 24-month shelf life when properly stored. ASA 100 is REACh registered
      (01-2119533117-46) under the name 2,5-Furandione,dihydro-,mono-C15-20-alkenyl
      derivs. Safety considerations include its classification as a mild primary skin
      irritant requiring adequate ventilation during handling and appropriate personal
      protective equipment.'
