derived_info:
  summary: DCA 467 (Trimethylolpropane tris(2-methyl-1-aziridinepropionate)) is a
    polyaziridine crosslinker containing three aziridine functional groups with an
    average molecular weight of ~467 g/mole and a functional equivalent weight of
    ~157 g/mole. It is used to enhance water, chemical, abrasion, and humidity resistance
    in coatings when added at 1-3% to acrylic emulsions or waterborne urethane polymers.
    The product works at ambient temperatures to crosslink polymers with reactive
    carboxyl functionality, making it ideal for fast air-dry systems. For many applications,
    0.6 equivalents of DCA 467 are sufficient to achieve optimal film properties,
    though some systems may require the full stoichiometric equivalent. Toxicology
    studies indicate moderate toxicity (LD50 of 3,038 mg/kg), mild skin irritation,
    and primary eye irritation with corrosive effects. While the pure compound shows
    low mutagenic activity in Ames tests, formulated products and dried films containing
    DCA 467 demonstrate no measurable mutagenic activity.
  personas:
    sales_summary: DCA 467 is a premium polyaziridine crosslinker that delivers significant
      performance enhancements to waterborne and solvent-based coating systems at
      room temperature. With just a 1-3% addition rate, it dramatically improves water,
      chemical, abrasion, and humidity resistance in acrylic emulsions and urethane
      polymers. This versatile crosslinker is particularly effective with fast air-dry
      NeoCryl acrylic emulsions, NeoRez waterborne urethanes, and NeoPac urethane
      acrylic copolymers. The product offers formulators a competitive edge through
      enhanced coating durability without requiring heat curing, making it ideal for
      field applications and temperature-sensitive substrates. While the pure compound
      requires standard safety precautions during handling, the final cured films
      are non-mutagenic, providing both performance and safety assurance for your
      customers' applications.
    technical_summary: DCA 467 is a trifunctional aziridine crosslinker (MW ~467 g/mol,
      equivalent weight ~157 g/mol) that reacts with carboxyl functionality at ambient
      temperatures. Typical properties include light yellow liquid appearance, amine-like
      odor, relative density of 1.08, flash point of 487°F (253°C), and dynamic viscosity
      of ~200 cPs. Specifications include viscosity at 25°C of 150-350 cPs, <1.0 ppm
      propyleneimine, minimum 99% solids, and maximum Gardner color of 2. For optimal
      performance, addition levels of 1-3% are recommended, with 0.6 equivalents typically
      sufficient for most applications. Toxicology profile shows LD50 of 3,038 mg/kg
      (oral), primary skin irritation value of 2.65/8, primary eye irritant with corrosive
      effects, and low mutagenic activity (0.18 revertant/μg) in pure form, though
      formulated products and dried films show no mutagenic activity. Proper handling
      requires avoiding skin/eye contact and using appropriate PPE. Store in cool,
      dry, dark conditions to prevent discoloration, deterioration, or gelation.
  key_applications:
  - Crosslinker for acrylic emulsions
  - Crosslinker for waterborne urethane polymers
  - Crosslinker for urethane acrylic copolymers
  - Crosslinker for solvent-based systems with carboxyl functionality
  - Fast air-dry coating systems
  - Water-resistant coatings
  - Chemical-resistant coatings
  - Abrasion-resistant coatings
  - Humidity-resistant coatings
  - Room temperature curing systems
