derived_info:
  summary: This technical bulletin provides detailed information about MHHPA 301 (Pre-Catalyzed
    Methylhexahydrophthalic Anhydride), a specialty epoxy curing agent manufactured
    by Dixie Chemical. The product is characterized as a low color, low viscosity,
    pre-catalyzed epoxy curing agent with a proprietary catalyst that offers several
    key benefits. These include easy handling due to its low viscosity (40-100 cP
    at 25°C), convenience by eliminating the need to add small amounts of catalyst,
    consistency by preventing batch-to-batch differences, low reactivity at room temperature
    providing long working times, high reactivity at cure temperature resulting in
    high crosslinking and relatively high glass transition temperatures (Tg), and
    low color development making it suitable for premium optical and electrical applications.
    The bulletin includes a comprehensive formulation example showing MHHPA 301's
    compatibility with various epoxy resin types, including standard BPA liquid epoxy,
    low viscosity BPA liquid, cycloaliphatic epoxy, epoxy phenol novolac, epoxy BPA
    novolac, and BPF liquid epoxy. For each formulation, the document provides details
    on the parts per hundred resin (phr) of MHHPA 301 used, the resulting viscosity
    at 25°C, gel time, and glass transition temperature after curing. The highest
    Tg (206°C) is achieved with cycloaliphatic epoxy. The bulletin also includes a
    vapor pressure vs. temperature graph showing the product's vapor pressure characteristics
    from 0°C to 200°C. Important handling and storage information emphasizes protecting
    the product from moisture contamination to prevent formation of methylhexahydrophthalic
    acid. Health hazard information identifies the product as a primary skin and eye
    irritant, requiring appropriate personal protective equipment including chemical
    goggles and impenetrable gloves. The product is available from Dixie Chemical's
    plant in Pasadena, Texas.
  personas:
    sales_summary: MHHPA 301 is a premium pre-catalyzed epoxy curing agent that offers
      significant advantages for your customers in high-performance electrical, optical,
      and composite applications. This clear liquid product comes with the catalyst
      already incorporated, eliminating the need for your customers to handle, measure,
      and disperse small amounts of catalyst—saving them time, reducing errors, and
      ensuring batch-to-batch consistency. With its low viscosity (40-100 cP), MHHPA
      301 creates low-viscosity mixtures with various epoxy resins, making it exceptionally
      easy to process and apply. The product's dual-reactivity profile provides extended
      working time at room temperature for comfortable processing, while delivering
      excellent cure response at elevated temperatures, resulting in high crosslinking
      and impressive glass transition temperatures (up to 206°C with cycloaliphatic
      epoxy systems). MHHPA 301's low color and exceptional resistance to yellowing
      make it the ideal choice for applications where optical clarity and electrical
      performance are critical, such as LED encapsulation, optical components, and
      high-performance electrical insulation. Our comprehensive formulation data demonstrates
      MHHPA 301's versatility across six different epoxy resin types, allowing you
      to recommend the optimal formulation based on your customer's specific performance
      requirements. The product is manufactured at our Pasadena, Texas facility with
      strict quality control to ensure consistent performance in your customers' most
      demanding applications.
    technical_summary: MHHPA 301 is a pre-catalyzed methylhexahydrophthalic anhydride
      with a molecular weight of 170 and specific gravity of 1.20 g/cc at 25°C. This
      clear liquid has a controlled viscosity range of 40-100 cP (Brookfield at 25°C)
      and low color (< 50 Pt-Co). The product contains a proprietary catalyst system
      that eliminates the need for separate catalyst addition while maintaining low
      reactivity at ambient temperature and high reactivity at cure temperature. Vapor
      pressure remains below 1 mm Hg up to approximately 110°C, then increases exponentially
      to approximately 80 mm Hg at 200°C. Formulation guidelines typically recommend
      80-90 phr with bisphenol A liquid epoxy resins, though optimal loading varies
      by resin type (89 phr for standard BPA liquid epoxy, 122 phr for cycloaliphatic
      epoxy). When properly cured (1 hr at 120°C + 1 hr at 220°C), systems achieve
      glass transition temperatures ranging from 134°C (epoxy phenol novolac) to 206°C
      (cycloaliphatic epoxy). The product's low residual unsaturation provides excellent
      resistance to yellowing, critical for optical applications. MHHPA 301 is moisture-sensitive
      and will form methylhexahydrophthalic acid upon water exposure; therefore, storage
      conditions must prevent moisture contamination. The material is classified as
      a primary skin and eye irritant, requiring appropriate PPE including chemical
      goggles, impenetrable gloves, and adequate ventilation. Quality control testing
      employs standard methods including D-102 (ASTM D 4052) for specific gravity,
      D-104 for appearance, D-150 for viscosity, and D-103 (ASTM D 1209) for color.
