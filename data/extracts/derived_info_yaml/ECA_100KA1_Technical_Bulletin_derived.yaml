derived_info:
  summary: 'This technical bulletin provides detailed information about Epoxy Curing Agent 100KA1 (ECA 100KA1), a pre-catalyzed
    version of methylhexahydrophthalic anhydride (MHHPA) manufactured by Dixie Chemical. The document outlines ECA 100KA1''s
    typical properties, applications, formulation examples, handling and storage requirements, health hazards, and availability.
    ECA 100KA1 is characterized as a clear, colorless to pale yellow liquid with a Gardner Color of 2 Max, specific gravity
    of 1.20-1.22 g/cc at 25°C, viscosity of 60-80 cPs at 25°C, minimum anhydride content of 95%, maximum acid content of 0.5%,
    and maximum moisture content of 0.1%. The bulletin highlights that ECA 100KA1 is a non-crystallizing anhydride curing
    agent for epoxy resins, used in epoxy laminating, filament winding, and electrical encapsulation applications where its
    excellent electrical properties are utilized. It is particularly suitable for applications requiring UV resistance and
    alkaline resistance. The document provides formulation examples with six different epoxy resin types: bisphenol A (D.E.R.
    331), bisphenol F (D.E.R. 354), polyglycol (D.E.R. 732), cycloaliphatic (ERL 4221), novolac (D.E.N. 438), and glycidyl
    ester (Heloxy 71). For each formulation, the anhydride level is calculated at 0.85 moles of anhydride per epoxy equivalent,
    with a recommended cure schedule of 2 hours at 80°C followed by 2 hours at 150°C. The bulletin emphasizes that ECA 100KA1
    must be stored out of contact with moisture to avoid hydrolysis of the anhydride to the acid, with a shelf life of 12
    months when properly stored. Safety information indicates that ECA 100KA1 is a skin and eye irritant requiring adequate
    ventilation during handling and immediate flushing with water for at least 15 minutes in case of skin or eye contact.
    The product is available from Dixie Chemical''s facility in Pasadena, Texas.'
  personas:
    sales_summary: ECA 100KA1 is a premium pre-catalyzed version of methylhexahydrophthalic anhydride (MHHPA) that offers
      significant processing advantages for manufacturers working with epoxy systems. This clear, low-viscosity liquid (60-80
      cPs) provides faster cure cycles and eliminates the crystallization issues common with standard MHHPA products, reducing
      production delays and improving manufacturing efficiency. With a high anhydride content (minimum 95%) and low acid and
      moisture levels, ECA 100KA1 delivers consistent, high-quality performance across diverse applications. The product's
      versatility is demonstrated through its compatibility with all major epoxy resin types—bisphenol A, bisphenol F, cycloaliphatic,
      novolac, and glycidyl ester—making it a single-source solution for multiple production needs. ECA 100KA1 creates cured
      systems with excellent electrical properties, making it ideal for electrical encapsulation applications in demanding
      environments. Its superior UV and alkaline resistance provide extended service life in outdoor and harsh chemical environments,
      reducing warranty claims and replacement costs. The product's REACh registration in the EU ensures regulatory compliance
      for global markets. With detailed formulation examples provided for six different epoxy resin systems and a straightforward
      cure schedule (2 hours at 80°C followed by 2 hours at 150°C), ECA 100KA1 offers customers a well-documented path to
      successful implementation. Available from our Pasadena, Texas facility with a 12-month shelf life when properly stored,
      ECA 100KA1 represents a high-value, problem-solving curing agent for customers in the electrical, composite, and specialty
      coatings industries.
    technical_summary: 'Epoxy Curing Agent 100KA1 (ECA 100KA1) is a pre-catalyzed methylhexahydrophthalic anhydride (MHHPA)
      with CAS number 25550-51-0 and EU REACh registration number 01-2119943714-35. The product appears as a clear, colorless
      to pale yellow liquid with Gardner Color of 2 Max (D-150G). Physical properties include specific gravity of 1.20-1.22
      g/cc at 25°C (D-102/ASTM D 4052), viscosity of 60-80 cPs at 25°C (D-150V), minimum anhydride content of 95% (D-150M),
      maximum acid content of 0.5% (D-150M), and maximum moisture content of 0.1% (D-150M). As a non-crystallizing anhydride
      curing agent, ECA 100KA1 eliminates the handling issues associated with standard MHHPA products. The pre-catalyzed nature
      accelerates cure response without requiring additional catalysts. Formulation guidelines are based on 0.85 moles of
      anhydride per epoxy equivalent, with specific ratios provided for six epoxy resin types: D.E.R. 331 (bisphenol A, EEW
      186, 90 phr), D.E.R. 354 (bisphenol F, EEW 167, 80 phr), D.E.R. 732 (polyglycol, EEW 320, 155 phr), ERL 4221 (cycloaliphatic,
      EEW 133, 65 phr), D.E.N. 438 (novolac, EEW 176, 85 phr), and Heloxy 71 (glycidyl ester, EEW 148, 72 phr). The recommended
      cure schedule for all formulations is 2 hours at 80°C followed by 2 hours at 150°C. ECA 100KA1 must be stored away from
      moisture to prevent hydrolysis of the anhydride to the acid, with a 12-month shelf life under proper storage conditions.
      The material is classified as a skin and eye irritant requiring standard chemical handling precautions including adequate
      ventilation and appropriate personal protective equipment. Primary applications include epoxy laminating, filament winding,
      electrical encapsulation, and systems requiring UV and alkaline resistance.'
