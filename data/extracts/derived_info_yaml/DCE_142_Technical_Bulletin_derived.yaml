derived_info:
  summary: DCE 142 (Diglycidyl 1,2-cyclohexanedicarboxylate, CAS# 5493-45-8) is a
    low viscosity cycloaliphatic diepoxy manufactured by Dixie Chemical. This clear
    to light yellow liquid has an epoxy equivalent weight of 160-181 g/mol, viscosity
    of 500-1,300 cPs at 25°C, and specific gravity of 1.20-1.25. When cured with carboxylic
    anhydrides, DCE 142 produces resins with excellent mechanical properties, high
    glass transition temperature (Tg), superior weather and chemical resistance, and
    outstanding electrical insulation characteristics. Its non-yellowing properties
    make it particularly valuable for outdoor applications. The product is ideal for
    coatings, electrical insulation components designed for medium/high voltage applications,
    and high-performance/temperature composites. DCE 142 has a flash point above 336°F
    (169°C) and contains minimal residual epichlorohydrin (0-50 ppm). Safety considerations
    include skin and eye irritation potential, requiring appropriate personal protective
    equipment including chemical goggles and impenetrable gloves during handling.
    The material must be stored in dry, cool, well-ventilated areas away from strong
    acids/bases, oxidizing agents, and ignition sources.
  personas:
    sales_summary: DCE 142 is our premium cycloaliphatic diepoxy that delivers exceptional
      performance in demanding electrical and outdoor applications. This low viscosity
      (500-1,300 cPs) liquid epoxy offers formulators excellent processability while
      achieving superior cured properties when combined with carboxylic anhydrides.
      DCE 142 stands out for its ability to create systems with outstanding electrical
      resistance, making it ideal for medium to high voltage insulation components.
      Its exceptional weather and chemical resistance, combined with non-yellowing
      characteristics, make it perfect for outdoor applications where aesthetic stability
      and long-term performance are critical. The product's high glass transition
      temperature ensures excellent thermal performance in high-temperature composite
      applications. With tight manufacturing controls ensuring low residual epichlorohydrin
      levels (≤50 ppm) and consistent color (Gardner 0-3), DCE 142 provides reliable
      batch-to-batch performance. This versatile diepoxy is the preferred choice for
      formulators developing high-performance coatings, electrical insulation systems,
      and advanced composites where superior electrical properties, weatherability,
      and thermal performance are essential.
    technical_summary: DCE 142 (Diglycidyl 1,2-cyclohexanedicarboxylate, CAS# 5493-45-8)
      is a cycloaliphatic diepoxy with an epoxy equivalent weight of 160-181 g/mol.
      This clear to light yellow liquid has a viscosity range of 500-1,300 cPs at
      25°C, specific gravity of 1.20-1.25, and refractive index of 1.480-1.491. The
      product is manufactured with strict quality controls, maintaining residual epichlorohydrin
      below 50 ppm and Gardner color between 0-3. With a flash point above 336°F (169°C),
      DCE 142 offers good thermal stability during processing. When formulated with
      carboxylic anhydrides, it produces systems with high glass transition temperature
      (Tg), excellent mechanical properties, and superior electrical resistance. The
      cycloaliphatic structure contributes to exceptional weather/chemical resistance
      and non-yellowing characteristics, making it suitable for outdoor applications.
      DCE 142 is classified as a skin and eye irritant, requiring appropriate PPE
      including chemical goggles, impenetrable gloves, and adequate ventilation during
      handling. The material is incompatible with strong acids/bases and oxidizing
      agents, necessitating storage in dry, cool, well-ventilated areas away from
      ignition sources. Recommended applications include electrical insulation for
      medium/high voltage components, outdoor coatings, and high-temperature composites.
  key_applications:
  - Electrical insulation components for medium/high voltage
  - Outdoor coatings with non-yellowing requirements
  - High performance/temperature composites
  - Weather-resistant coatings
  - Chemical-resistant coatings
  - Electrical potting compounds
  - Electrical encapsulation
  - Outdoor electrical components
  - High Tg composite systems
  - Cycloaliphatic epoxy formulations
