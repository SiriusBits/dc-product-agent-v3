derived_info:
  summary: NADIC® Methyl Anhydride (NMA) is a highly reactive anhydride curing agent for epoxy resins, characterized by its
    white crystalline solid form with a molecular weight of 178.2 g/mol and melting point of 92-97°C. It provides exceptional
    high-temperature resistance, excellent electrical properties, and good chemical resistance in cured systems. NMA is particularly
    valued in aerospace, military, and electrical applications where performance at elevated temperatures is critical. When
    used with standard bisphenol A epoxy resins, NMA produces systems with heat deflection temperatures around 145°C, while
    formulations with epoxy bisphenol A novolac resins can achieve glass transition temperatures up to 221°C. The curing process
    typically involves a gel stage at 80-100°C followed by post-curing at 150-175°C, with tertiary amines like benzyldimethylamine
    (BDMA) serving as effective catalysts. NMA-cured systems demonstrate excellent retention of mechanical properties at elevated
    temperatures, making them ideal for demanding applications in electrical laminates, filament winding, encapsulation, tooling,
    composites, and powder coatings.
  personas:
    sales_summary: NADIC® Methyl Anhydride (NMA) is a premium curing agent that delivers exceptional high-temperature performance
      and electrical properties for demanding aerospace, military, and electrical applications. With heat deflection temperatures
      of 145°C for standard epoxy systems and glass transition temperatures up to 221°C with specialized resins, NMA provides
      a competitive edge in high-performance composites and electrical systems. Its excellent retention of mechanical properties
      at elevated temperatures makes it the preferred choice for applications where reliability under extreme conditions is
      non-negotiable. NMA-cured systems offer the perfect balance of processability and performance, with straightforward
      cure cycles and compatibility with common catalysts. This versatile product is available in convenient 50 lb bags and
      400 lb drums to accommodate various production scales.
    technical_summary: 'NADIC® Methyl Anhydride (NMA, CAS# 25134-21-8) is a white crystalline solid with MW 178.2 g/mol, melting
      point 92-97°C, and flash point 113°C. It contains minimum 99.0% anhydride content with maximum 1.0 mg KOH/g acid value.
      The theoretical loading is 93.8 phr for standard bisphenol A epoxy resins (EEW 190). NMA-cured systems exhibit HDT of
      145°C with standard resins and Tg up to 221°C with bisphenol A novolac resins. Mechanical properties include flexural
      strength of 18,000 psi, flexural modulus of 450,000 psi, and excellent property retention at elevated temperatures (55%
      flexural strength retention at 150°C). Electrical properties are outstanding with dielectric constants of 3.6-4.0, low
      dissipation factors (0.006-0.025), and high volume resistivity (7.2×10¹⁵ ohm-cm). Optimal cure cycle: 2h at 100°C followed
      by 4h at 175°C, catalyzed with 0.5-1.0 phr BDMA or imidazoles.'
  key_applications:
  - Aerospace and military composites
  - Electrical laminates
  - Filament winding
  - Electrical encapsulation
  - High-temperature tooling
  - Advanced composites
  - Powder coatings
